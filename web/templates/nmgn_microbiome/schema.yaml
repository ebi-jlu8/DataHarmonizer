id: https://nmgn.mrc.ukri.org/clusters/microbiome/
name: NMGN
description: A description of the schema containing one or more templates.
version: 1.0.0
in_language:
- en
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  GENEPIO: http://purl.obolibrary.org/obo/GENEPIO_
classes:
  dh_interface:
    name: dh_interface
    description: A DataHarmonizer interface
    from_schema: https://example.com/NMGN
  NMGN_microbiome:
    name: NMGN_microbiome
    title: NMGN microbiome
    description: National Mouse Genetics Network metadata template
    is_a: dh_interface
    see_also: templates/NMGN/SOP.pdf
    slots:
    - ena study accession
    - consortium_name
    - cluster_name
    - geographic location (country and/or sea)
    - geographic location (latitude)
    - geographic location (longitude)
    - facility
    - facility status
    - total cages in colony
    - cage bedding
    - cage ID
    - cage type
    - environmental enrichment
    - reciept date
    - acclimation protocol
    - chemical administration
    - diet vendor
    - genetic modification
    - age (days)
    - sampled body product
    - mouse color
    - common name
    - diet details
    - phenotype
    - scientific_name
    - gender
    - mouse source
    - subject ID
    - mouse supplier
    - mouse taxid
    - total mass
    - generations since colony refreshment
    - refreshment method
    - time of last refreshment
    - total number of breeding females
    - total number of mice in cage
    - water treatment
    - mouse strain/lineage
    - tax_id
    - sampled body site
    - collection date
    - collection start time
    - collection end time
    - amount or size of sample collected
    - broad-scale environmental context
    - local environmental context
    - environmental medium
    - oxygen exposure duration
    - sample collection method
    - sample material processing
    - sample storage duration
    - sample storage location
    - sample storage temperature
    - sample volume or weight for DNA extraction
    - sample_alias
    - sample_description
    - sample_title
    - organism_scientific_name
    slot_usage:
      ena study accession:
        rank: 1
        slot_group: study
      consortium_name:
        rank: 2
        slot_group: study
      cluster_name:
        rank: 3
        slot_group: study
      geographic location (country and/or sea):
        rank: 4
        slot_group: location
      geographic location (latitude):
        rank: 5
        slot_group: location
      geographic location (longitude):
        rank: 6
        slot_group: location
      facility:
        rank: 7
        slot_group: facility
      facility status:
        rank: 8
        slot_group: facility
      total cages in colony:
        rank: 9
        slot_group: housing
      cage bedding:
        rank: 10
        slot_group: housing
      cage ID:
        rank: 11
        slot_group: housing
      cage type:
        rank: 12
        slot_group: housing
      environmental enrichment:
        rank: 13
        slot_group: housing
      reciept date:
        rank: 14
        slot_group: mouse
      acclimation protocol:
        rank: 15
        slot_group: mouse
      chemical administration:
        rank: 16
