        rank: 31
        slot_group: mouse
      generations since colony refreshment:
        rank: 32
        slot_group: colony
      refreshment method:
        rank: 33
        slot_group: colony
      time of last refreshment:
        rank: 34
        slot_group: colony
      total number of breeding females:
        rank: 35
        slot_group: colony
      total number of mice in cage:
        rank: 36
