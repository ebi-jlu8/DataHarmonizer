        rank: 39
        slot_group: sample
      sampled body site:
        rank: 40
        slot_group: mouse
      collection date:
        rank: 41
        slot_group: sample
      collection start time:
        rank: 42
        slot_group: sample
      collection end time:
        rank: 43
        slot_group: sample
