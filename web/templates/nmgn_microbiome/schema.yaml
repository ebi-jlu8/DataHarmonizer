slots:
  ena study accession:
    name: ena study accession
    title: ena study accession
    description: primary project accession within which the sequencing was organised
      (e.g. PRJEB12345) .
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: PRJEBXXXXX
    slot_uri: GENEPIO:0100429
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:project%20name
    required: true
  consortium_name:
    name: consortium_name
    title: consortium_name
    description: name of the project consortium (NMGN) the sample was collected for
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: NMGN
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:consortium_name
    required: true
  cluster_name:
    name: cluster_name
    title: cluster_name
    description: cluster of the NMGN consortium the sample was collected for
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: MICROBIOME
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:cluster%20name
    required: true
  geographic location (country and/or sea):
    name: geographic location (country and/or sea)
    title: geographic location (country and/or sea)
    description: The geographical origin of where the sample was collected from, with
      the intention of sequencing, as defined by the country or sea name. Country
      or sea names should be chosen from the INSDC country list (http://insdc.org/country.html).
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: United Kingdom
    slot_uri: GENEPIO:0100629
    range: Permitted_countries_menu
    exact_mappings:
    - ENA_host_associated:geographic%20location%20(country%20and/or%20sea)
    required: true
  geographic location (latitude):
    name: geographic location (latitude)
    title: geographic location (latitude)
    description: 'The geographical origin of the sample as defined by latitude. The
      values should be reported in decimal degrees and in WGS84 system. For samples
      where the location is deidentified, please use ''''restricted access" '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '51.75314817'
    slot_uri: GENEPIO:0100309
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:geographic%20location%20(latitude)
    required: true
  geographic location (longitude):
    name: geographic location (longitude)
    title: geographic location (longitude)
    description: 'The geographical origin of the sample as defined by longitude. The
      values should be reported in decimal degrees and in WGS84 system. For samples
      where the location is deidentified, please use ''''restricted access" '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '-1.214122657'
    slot_uri: GENEPIO:0100310
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:geographic%20location%20(longitude)
    required: true
  facility:
    name: facility
    title: facility
    description: The name or unique identifier of the mouse facility the sampled mouse
      was housed in
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: OCMS
    slot_uri: NCIT:C62574
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:facility
    required: true
  facility status:
    name: facility status
    title: facility status
    description: The microbial status of the mouse facility the sampled mouse was
      housed in (E.g. SPF)
    comments: 'accepted valuse: SPF, gnotobiotic, germ-free'
    examples:
    - value: SPF
    slot_uri: GENEPIO:0000000
    range: conditions_options
    exact_mappings:
    - ENA_host_associated:facility%20condition
    required: true
  total cages in colony:
    name: total cages in colony
    title: total cages in colony
    description: The total number of cages in the sampled mouse colony
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '12'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:breeding%20community%20total%20enclosures
    recommended: true
  cage bedding:
    name: cage bedding
    title: cage bedding
    description: The type and details of bedding used in the cage the sampled mouse
      was caged in
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: wood chips (non-aspen)
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:enclosure%20bedding
    recommended: true
  cage ID:
    name: cage ID
    title: cage ID
    description: A unique name or identifier of the cage that the sampled mouse was
      housed in
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: cage B
    slot_uri: ENVO:00002191
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:Enclosure%20ID
    recommended: true
  cage type:
    name: cage type
    title: cage type
    description: The type of cage the sampled mouse was caged in
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: IVC
    slot_uri: ENVO:01000922
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:enclosure%20type
    recommended: true
  environmental enrichment:
    name: environmental enrichment
    title: environmental enrichment
    description: details of any environmental enrichments provided in the cage of
      the sampled mouse
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: chewing implements
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:environmental%20enrichment
    recommended: true
  reciept date:
    name: reciept date
    title: reciept date
    description: 'The date the sampled mouse was received (YYYY-MM-DD) if it was purchased
      from a vendor. '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: 03/02/2025
    slot_uri: NCIT:C164590
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:animal%20receipt%20date
    required: false
  acclimation protocol:
    name: acclimation protocol
    title: acclimation protocol
    description: if host was imported, the acclimitization protocol used to adapt
      the sampled mouse to the settings in the research environment.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: https://jordbruksverket.se/download/18.2973671e191b5a0f12c1770e/1725968915108/Acclimatisation-of-mice-prior-to-experiments-support-material-from-the-Swedish-3Rs-Center-tga.pdf
    slot_uri: NCIT:C68767
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:acclimation%20protocol
    required: false
  chemical administration:
    name: chemical administration
    title: chemical administration
    description: The list of chemical compounds administered to the sampled mouse.
      May include multiple compounds. You may refer to the Chemical Entities of Biological
      Interest (CHEBI) ontology for more details - http://purl.bioontology.org/ontology/CHEBI
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: tamoxifin
    slot_uri: PRIDE:0000684
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:chemical%20administration
    required: false
  diet vendor:
    name: diet vendor
    title: diet vendor
    description: Vendor that the diet of the sampled mouse was sourced from
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: Mazuri
    slot_uri: NCIT:C68608
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:diet%20vendor
    recommended: true
  genetic modification:
    name: genetic modification
    title: genetic modification
    description: Any genetic modification of the genome of the sampled mouse which
      may occur naturally by spontaneous mutation or be introduced by some experimental
      means.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: SYK GOF
    slot_uri: DICOM:127414
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:genetic%20modification
    recommended: true
  age (days):
    name: age (days)
    title: age (days)
    description: Age of the sampled mouse (in days).
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '54'
    slot_uri: GENEPIO:0001392
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20age
    required: true
  sampled body product:
    name: sampled body product
    title: sampled body product
    description: Substance (of the sample) produced by the mouse body (e.g. feces,
      mucus)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: feces
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20body%20product
    recommended: true
  mouse color:
    name: mouse color
    title: mouse color
    description: the color of the sampled mouse (e.g. black for C57BL/6 mice)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: black
    slot_uri: OBA:1000071
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20color
    recommended: true
  common name:
    name: common name
    title: common name
    description: common name of the sampled animal. As an example, for C57BL/6, you
      can use black 6 mouse
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: black 6 mouse
    slot_uri: GENEPIO:0001386
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20common%20name
    recommended: true
  diet details:
    name: diet details
    title: diet details
    description: type and details of diet given to the sampled mouse
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: chow
    slot_uri: EUPATH:0000590
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20diet
    recommended: true
  phenotype:
    name: phenotype
    title: phenotype
    description: phenotype of the sampled mouse For mouse phenotypes, please refer
      to MGI (https://www.informatics.jax.org/vocab/mp_ontology/MP:0002169) for more
      information
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: wild type
    slot_uri: MP:0000001
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20phenotype
    recommended: true
  scientific_name:
    name: scientific_name
    title: scientific_name
    description: Scientific name of the sampled mouse. As an example, for samples
      collected from C57BL/6 mice, the scientific name is Mus musculus
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: Mus musculus
    slot_uri: GENEPIO:0001387
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20scientific%20name
    required: true
  gender:
    name: gender
    title: gender
    description: Gender or sex of the sampled mouse
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: female
    slot_uri: GENEPIO:0001395
    range: host_sex_options
    exact_mappings:
    - ENA_host_associated:host%20sex
    required: true
  mouse source:
    name: mouse source
    title: mouse source
    description: if the host was bought from a supplier, or bred onsite
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: bred onsite
    slot_uri: GENEPIO:0000000
    range: source_options
    exact_mappings:
    - ENA_host_associated:host%20source
    recommended: true
  subject ID:
    name: subject ID
    title: subject ID
    description: 'A unique name or identifier for the sampled mouse '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '#131'
    slot_uri: GENEPIO:0001398
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20subject%20id
    recommended: true
  mouse supplier:
    name: mouse supplier
    title: mouse supplier
    description: The name of the supplier/vendor the sampled mouse was sourced from
      if bought off-site
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: jax lab
    slot_uri: SLSO:0001167
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20supplier
    recommended: true
  mouse taxid:
    name: mouse taxid
    title: mouse taxid
    description: The NCBI taxon ID of the host animal. For samples obtained from C57BL/6,
      we recommend using 10090 (mus musculus)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '10090'
    slot_uri: GENEPIO:0100628
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20taxid
    recommended: true
  total mass:
    name: total mass
    title: total mass
    description: total mass of the host  (in grams) at the time of sample collection.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '21'
    slot_uri: PRIDE:0000687
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20total%20mass
    recommended: true
  generations since colony refreshment:
    name: generations since colony refreshment
    title: generations since colony refreshment
    description: if bred on-site, provide number of generations since the colony was
      last refreshed
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '3'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:number%20of%20generations%20since%20colony%20refreshment
    required: false
  refreshment method:
    name: refreshment method
    title: refreshment method
    description: method used for refreshment of the mouse colony
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: backcross with parents
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:refreshment%20method
    required: false
  time of last refreshment:
    name: time of last refreshment
    title: time of last refreshment
    description: time and date the mouse colony was last refreshed (provided in ISO
      format)
    comments: ISO 8601 format
    examples:
    - value: '2024-12-05'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:time%20of%20last%20refreshment
    required: false
  total number of breeding females:
    name: total number of breeding females
    title: total number of breeding females
    description: the total number of breeding females in mouse colony at the time
      of sampling
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '9'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:total%20number%20of%20breeding%20females
    required: false
  total number of mice in cage:
    name: total number of mice in cage
    title: total number of mice in cage
    description: The total number of mice in the cage with the sampled mouse (including
      the sampled mouse, e.g. 5)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '5'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:total%20number%20of%20lab%20animal%20in%20enclosure
    required: false
  water treatment:
    name: water treatment
    title: water treatment
    description: 'pre-treatment of the mouse colony''s drinking water (if any) '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: autoclaving
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:water%20treatment
    required: false
  mouse strain/lineage:
    name: mouse strain/lineage
    title: mouse strain/lineage
    description: strain/lineage of the sampled mouse (e.g. C57BL)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: C57BL
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20animal%20strain/lineage
    recommended: true
  tax_id:
    name: tax_id
    title: tax_id
    description: 'Taxonomy ID of the organism as in the NCBI Taxonomy database. Entries
      in the NCBI Taxonomy database have integer taxon IDs. Please note: this refers
      to the taxonomy of the collected sample and not the sampled mouse. '
    comments: for NMGN, restricted to mouse metagenome and mouse gut metagenome
    examples:
    - value: 410661 (mouse gut metagenome)
    slot_uri: GENEPIO:0001640
    range: tax_id_menu
    exact_mappings:
    - ENA_host_associated:tax_id
    required: true
  sampled body site:
    name: sampled body site
    title: sampled body site
    description: name of the body site the sample was collected from. For samples
      collected in the mouse cage, we recommend using cecum.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: cecum
    slot_uri: PRIDE:0000685
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:host%20body%20site
    recommended: true
  collection date:
    name: collection date
    title: collection date
    description: 'The date the sample was collected with the intention of sequencing,
      either as an instance (single point in time) or interval. In case no exact time
      is available, the date/time can be right truncated i.e. all of these are valid
      ISO8601 compliant times: 2008-01-23T19:23:10+00:00; 2008-01-23T19:23:10; 2008-01-23;
      2008-01; 2008.'
    comments: ISO 8601 format
    examples:
    - value: '2008-01-23'
    slot_uri: GENEPIO:0001174
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:collection%20date
    required: true
  collection start time:
    name: collection start time
    title: collection start time
    description: start time of sample collection
    comments: ISO 8601 format
    examples:
    - value: .nan
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:collection%20start%20time
    recommended: true
  collection end time:
    name: collection end time
    title: collection end time
    description: end time of sample collection
    comments: ISO 8601 format
    examples:
    - value: .nan
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:collection%20end%20time
    recommended: true
  amount or size of sample collected:
    name: amount or size of sample collected
    title: amount or size of sample collected
    description: amount or size of sample collected
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '2'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:amount%20or%20size%20of%20sample%20collected
    recommended: true
  broad-scale environmental context:
    name: broad-scale environmental context
    title: broad-scale environmental context
    description: "Report the major environmental system the sample or specimen came\
      \ from. The system(s) identified should have a coarse spatial grain, to provide\
      \ the general environmental context of where the sampling was done (e.g. in\
      \ the desert or a rainforest). We recommend using subclasses of EnvO\xD5s biome\
      \ class: http://purl.obolibrary.org/obo/ENVO_00000428. EnvO documentation about\
      \ how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS."
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: SPF mouse facility
    slot_uri: GENEPIO:0000027
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:broad-scale%20environmental%20context
    required: true
  local environmental context:
    name: local environmental context
    title: local environmental context
    description: "Report the entity or entities which are in the sample or specimen\xD5\
      s local vicinity and which you believe have significant causal influences on\
      \ your sample or specimen. We recommend using EnvO terms which are of smaller\
      \ spatial grain than your entry for \"broad-scale environmental context\". Terms,\
      \ such as anatomical sites, from other OBO Library ontologies which interoperate\
      \ with EnvO (e.g. UBERON) are accepted in this field. EnvO documentation about\
      \ how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS."
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: mouse digestive system
    slot_uri: GENEPIO:0000027
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:local%20environmental%20context
    required: true
  environmental medium:
    name: environmental medium
    title: environmental medium
    description: 'Report the environmental material(s) immediately surrounding the
      sample or specimen at the time of sampling. We recommend using subclasses of
      ''environmental material'' (http://purl.obolibrary.org/obo/ENVO_00010483). EnvO
      documentation about how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS
      . Terms from other OBO ontologies are permissible as long as they reference
      mass/volume nouns (e.g. air, water, blood) and not discrete, countable entities
      (e.g. a tree, a leaf, a table top).'
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: caecum
    slot_uri: GENEPIO:0000027
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:environmental%20medium
    required: true
  oxygen exposure duration:
    name: oxygen exposure duration
    title: oxygen exposure duration
    description: duration of exposure of collected sample to oxygen shown in ISO8601
      format.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: 00:00:10
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:oxygen%20exposure%20duration
    required: false
  sample collection method:
    name: sample collection method
    title: sample collection method
    description: the method employed for collection of sample. Can be provided in
      the form of a PMID, DOI, url or text
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: collection from cage
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample%20collection%20method
    recommended: true
  sample material processing:
    name: sample material processing
    title: sample material processing
    description: A brief description of any processing applied to the sample during
      or after retrieving the sample from environment, or a link to the relevant protocol(s)
      performed
    comments: use list of NMGN approved methods?
    examples:
    - value: ice method
    slot_uri: GENEPIO:0000000
    range: process_menu
    exact_mappings:
    - ENA_host_associated:sample%20material%20processing
    recommended: true
  sample storage duration:
    name: sample storage duration
    title: sample storage duration
    description: duration for which sample was stored before nucleic acid extraction
      for sequencing (written in ISO 8601 format)
    comments: 'ISO 8601 format; how specific do we need to be for this field. '
    examples:
    - value: 34:00:00:00T (34 days)
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample%20storage%20duration
    required: false
  sample storage location:
    name: sample storage location
    title: sample storage location
    description: location of the fridge or room where the samples are stored. If the
      location of the facility is anonymized, should we mask this field as well?
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: ROOM 453, Freezer D, Box3-A3
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample%20storage%20location
    required: false
  sample storage temperature:
    name: sample storage temperature
    title: sample storage temperature
    description: temperature at which sample was stored
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '-80'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample%20storage%20temperature
    required: false
  sample volume or weight for DNA extraction:
    name: sample volume or weight for DNA extraction
    title: sample volume or weight for DNA extraction
    description: 'Mass (g) of total collected sample for DNA extraction. Note: total
      sample collected should be entered under the term''amount or size of sample
      collected''.'
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '2'
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample%20volume%20or%20weight%20for%20DNA%20extraction
    required: false
  sample_alias:
    name: sample_alias
    title: sample_alias
    description: 'Unique name of the sample. If not selected system will automatically
      use the ENA sample accession as the sample ID '
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: syk mouse gut sample 1
    slot_uri: GENEPIO:0100427
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample_alias
    recommended: true
  sample_description:
    name: sample_description
    title: sample_description
    description: description of the sample
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: fecal sample collected from syk mouse gut
    slot_uri: GENEPIO:0100439
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample_description
    required: true
  sample_title:
    name: sample_title
    title: sample_title
    description: title of the sample
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: mouse sample 1
    slot_uri: GENEPIO:0001808
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:sample_title
    required: true
  organism_scientific_name:
    name: organism_scientific_name
    title: organism_scientific_name
    description: Scientific name of the organism as in the NCBI Taxonomy database.
      Scientific names typically follow the binomial nomenclature. For examle, fecal
      samples collected from the mouse gut is 'mouse gut metagenome' with the corresponding
      tax id 410661.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: mouse gut metagenome
    slot_uri: NCBITaxon:410661
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA_host_associated:scientific_name
    required: true
