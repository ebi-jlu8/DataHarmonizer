        slot_group: mouse
      mouse source:
        rank: 27
        slot_group: mouse
      subject ID:
        rank: 28
        slot_group: mouse
      mouse supplier:
        rank: 29
        slot_group: mouse
      mouse taxid:
        rank: 30
        slot_group: mouse
