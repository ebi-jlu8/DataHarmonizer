      mouse color:
        rank: 21
        slot_group: mouse
      common name:
        rank: 22
        slot_group: mouse
      diet details:
        rank: 23
        slot_group: mouse
      phenotype:
        rank: 24
        slot_group: mouse
      scientific_name:
        rank: 25
        slot_group: mouse
      gender:
