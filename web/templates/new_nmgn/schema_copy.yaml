id: https://nmgn.mrc.ukri.org/clusters/microbiome/
name: NMGN
description: A description of the schema containing one or more templates.
version: 1.0.0
in_language:
- en
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  GENEPIO: http://purl.obolibrary.org/obo/GENEPIO_
classes:
  dh_interface:
    name: dh_interface
    description: A DataHarmonizer interface
    from_schema: https://example.com/NMGN
  NMGN_microbiome:
    name: NMGN_microbiome
    title: NMGN microbiome
    description: National Mouse Genetics Network metadata template
    is_a: dh_interface
    see_also: templates/NMGN/SOP.pdf
    slots:
    - project name
    - consortium_name
    - geographic location (country and/or sea)
    - geographic location (latitude)
    - geographic location (longitude)
    - facility
    - facility status
    - total cages in colony
    - cage bedding
    slot_usage:
      project name:
        rank: 1
        slot_group: study
      consortium_name:
        rank: 2
        slot_group: study
      geographic location (country and/or sea):
        rank: 3
        slot_group: location
      geographic location (latitude):
        rank: 4
        slot_group: location
      geographic location (longitude):
        rank: 5
        slot_group: location
      facility:
        rank: 6
        slot_group: facility
      facility_location:
        rank: 7
        slot_group: facility
      total cages in colony:
        rank: 8
        slot_group: housing
      cage bedding:
        rank: 9
        slot_group: housing
slots:
  project name:
    name: project name
    title: project name
    description: Name of the project within which the sequencing was organized
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: PRJEB123456
    slot_uri: GENEPIO:0100429
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:project%20name
    required: true
  consortium_name:
    name: consortium_name
    title: consortium_name
    description: name of the project consortium the sample was collected for.
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: NMGN (national mouse genetics project)
    slot_uri: GENEPIO:000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:consortium_name
    required: true
  geographic location (country and/or sea):
    name: geographic location (country and/or sea)
    title: geographic location (country and/or sea)
    description: The geographical origin of where the sample was collected from, with
      the intention of sequencing, as defined by the country or sea name. Country
      or sea names should be chosen from the INSDC country list (http://insdc.org/country.html).
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: United Kingdom
    slot_uri: GENEPIO:0100629
    range: Permitted_countries_menu
    exact_mappings:
    - ENA:geographic%20location%20(country%20and/or%20sea)
    required: true 
  geographic location (latitude):
    name: geographic location (latitude)
    title: geographic location (latitude)
    description: The geographical origin of the sample as defined by latitude. The
      values should be reported in decimal degrees and in WGS84 system
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '51.75314817'
    slot_uri: GENEPIO:0100309
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:geographic%20location%20(latitude)
    required: true
  geographic location (longitude):
    name: geographic location (longitude)
    title: geographic location (longitude)
    description: The geographical origin of the sample as defined by longitude. The
      values should be reported in decimal degrees and in WGS84 system
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: '-1.214122657'
    slot_uri: GENEPIO:0100310
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:geographic%20location%20(longitude)
    required: true 
  facility:
    name: facility
    title: facility
    description: name or identification of the facility
    comments: any additional comments, can have multiple, seperated by commas
    examples: 
    - value: Kennedy SPF facility
    slot_uri: NCIT:C62574
    range: WhitespaceMinimizedString
    exact_mappings: 
    - ENA:facility
    required: true
  facility status:
    name: facility status
    title: facility status
    description: the microbiological status of the facility the sampled mouse was housed in (e.g. SPF)
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: SPF
    slot_uri: GENEPIO:0000000
    range: facility_condition_options
    exact_mappings:
    - ENA:facility%20status
    required: true
  total cages in colony:
    name: total cages in colony
    title: total cages in colony
    description: total number of cage or enclosures in the colony of the sampled mouse
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: 10
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:total%20cages%20in%20enclosure
    required: false
  cage bedding:
    name: cage bedding
    title: cage bedding
    description: The type and details of bedding used in the cage the sampled mouse
      was caged in
    comments: any additional comments, can have multiple, seperated by commas
    examples:
    - value: wood chips (non-aspen)
    slot_uri: GENEPIO:0000000
    range: WhitespaceMinimizedString
    exact_mappings:
    - ENA:enclosure%20bedding 
enums:
